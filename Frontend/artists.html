  <main>
    <h1>Artists</h1>

    <form id="artistForm">
      <input type="text" id="name" placeholder="Artist Name" required>
      <input type="text" id="genre" placeholder="Genre">
      <input type="number" id="listeners" placeholder="Monthly Listeners">
      <button type="submit">Add Artist</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Genre</th>
          <th>Listeners</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="artistTable"></tbody>
    </table>
  </main>
