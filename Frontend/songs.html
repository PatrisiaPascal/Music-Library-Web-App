  <main>
    <h1>Songs</h1>

    <form id="songForm">
      <input type="text" id="song_name" placeholder="Song Name" required>
      <input type="number" id="song_year" placeholder="Release Year">
      <input type="number" id="album_id" placeholder="Album ID">
      <button type="submit">Add Song</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Year</th>
          <th>Album ID</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="songTable"></tbody>
    </table>
